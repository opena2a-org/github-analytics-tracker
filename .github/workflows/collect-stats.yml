name: Collect Analytics

on:
  schedule:
    # Run daily at 6:00 AM UTC (12:00 AM Denver / MDT)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Opt the bundled JS actions (checkout/setup-node) into the Node 24 runtime
      # ahead of the 2026-06-16 forced cutover, silencing the Node 20 deprecation
      # warning. Remove once the actions ship Node 24-native majors.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_STATS_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup database (if needed)
        run: npm run setup-db

      - name: Collect GitHub stats
        id: github
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_ORG: opena2a-org,opena2a-standards,ecolibria
        run: npm run collect

      - name: Collect npm stats
        id: npm
        continue-on-error: true
        env:
          NPM_AUTHOR: ecolibria
          # Scoped @opena2a/* packages are pinned explicitly because npm
          # author-discovery does not reliably return scoped packages.
          NPM_PACKAGES: opena2a-cli,@opena2a/aicomply
        run: npm run collect-npm

      - name: Collect PyPI stats
        id: pypi
        continue-on-error: true
        env:
          # PyPI has no author-discovery API (profile pages are bot-gated).
          # New packages are auto-discovered by scanning GITHUB_ORG repos for
          # Python packaging files (see collect-pypi-stats.js). PYPI_PACKAGES
          # remains a safety-net for packages whose repo lives outside these
          # orgs or isn't discoverable.
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_ORG: opena2a-org,opena2a-standards,ecolibria
          PYPI_PACKAGES: cryptoserve,cryptoserve-core,cryptoserve-auto,cryptoserve-client,aim-sdk,aicomply
        run: npm run collect-pypi

      - name: Collect Docker stats
        id: docker
        continue-on-error: true
        env:
          DOCKER_IMAGES: opena2a/dvaa,opena2a/aim-server,opena2a/aim-dashboard
        run: npm run collect-docker

      - name: Collect HuggingFace stats
        id: huggingface
        continue-on-error: true
        env:
          HF_AUTHOR: opena2a
        run: npm run collect-hf

      - name: Collect Chrome Web Store stats
        id: chrome
        continue-on-error: true
        env:
          # Chrome Web Store extension ids (no install/download API exists; the
          # collector scrapes the public listing's rounded weekly-active-user
          # count, a snapshot shown for context and never summed into adoption).
          CHROME_EXTENSIONS: ojphpdmabflmcjhglfogmkdgchkncikf
        run: npm run collect-chrome

      - name: Collect first-party CLI telemetry
        id: telemetry
        # Every collector step above carries continue-on-error so one outage
        # never drops the other collectors' data: they all run before
        # generate-md/generate-summary and the commit step, so a hard failure
        # would silently cost a full day of the other sources' numbers.
        #
        # But continue-on-error alone would ALSO swallow the failure — the job
        # would go green and a scheduled run that nobody watches would notify
        # nobody, which is the exact silence this is meant to end. The step
        # outcomes are passed to generate-summary (summary.collectors, and any
        # failed source marks its series "partial"), and the "Verify run" step
        # at the end re-raises every failure once the data is safely committed.
        continue-on-error: true
        env:
          # Registry base URL exposing the coarse public adoption feed
          # (GET /api/v1/telemetry/v1/adoption/public). Only coarse, anonymous
          # active-user aggregates are collected here; fine-grained detail is
          # never persisted. Unset -> warns, and errors only if telemetry was
          # previously being collected (i.e. the variable was removed).
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
        run: npm run collect-telemetry

      - name: Generate markdown files
        run: npm run generate-md

      - name: Generate summary JSON
        env:
          # Per-collector outcomes for summary.collectors; a failed source marks
          # the series that sum it as "partial" rather than a healthy value.
          COLLECTOR_OUTCOMES: >-
            {"github":"${{ steps.github.outcome }}",
             "npm":"${{ steps.npm.outcome }}",
             "pypi":"${{ steps.pypi.outcome }}",
             "docker":"${{ steps.docker.outcome }}",
             "huggingface":"${{ steps.huggingface.outcome }}",
             "chrome":"${{ steps.chrome.outcome }}",
             "telemetry":"${{ steps.telemetry.outcome }}"}
        run: npm run generate-summary

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/analytics.db data/collect-github-run.json data/badge-*.json data/stats-*.json data/npm-stats-*.json data/pypi-stats-*.json data/docker-badge-*.json data/hf-badge-*.json data/chrome-badge-*.json data/chrome-stats-*.json data/telemetry-badge.json data/summary.json ANALYTICS.md ANALYTICS_DETAILED.md
          git diff --staged --quiet || git commit -m "chore: update analytics data [skip ci]"
          # `git push || echo "No changes to push"` used to swallow EVERY push
          # failure — a non-fast-forward, a rejected hook, an auth error — and
          # report the run green with the day's data never pushed. Distinguish
          # "nothing to push" (fine) from "the push failed" (not fine): the
          # Surface step below relies on the data actually being committed.
          if git diff --quiet HEAD@{upstream} HEAD 2>/dev/null; then
            echo "No changes to push."
          else
            git push
          fi

      # Re-raise any collector failure AFTER the day's data is safely committed,
      # so the run goes red and the scheduled-workflow failure notification
      # fires. Without this the collectors' continue-on-error would leave the
      # job green and nobody would ever learn that collection stopped — which is
      # the failure mode this whole thing exists to prevent. Also fails when the
      # just-published summary is older than 48h (missed runs) or when GitHub
      # discovery found repos that did not reach traffic_summary today beyond
      # the allowlist.
      - name: Verify run
        env:
          # Repos discovery returns that are expected to have no traffic row
          # (the token lacks push access to them). Comma-separated owner/repo.
          TRAFFIC_MISSING_ALLOWLIST: ${{ vars.TRAFFIC_MISSING_ALLOWLIST }}
        run: npm run verify-run
